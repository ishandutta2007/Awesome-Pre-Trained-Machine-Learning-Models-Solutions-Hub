<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic / Animated Background Nodes and Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="500" y1="0" x2="500" y2="350"/>
    <line x1="700" y1="0" x2="700" y2="350"/>
    <line x1="900" y1="0" x2="900" y2="350"/>
    <line x1="1100" y1="0" x2="1100" y2="350"/>
  </g>

  <!-- Neural Network Nodes (Background Layer) -->
  <g opacity="0.4">
    <!-- Pulsing Orbs -->
    <circle cx="150" cy="80" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="90" r="5" fill="#c084fc">
      <animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="280" r="6" fill="#818cf8">
      <animate attributeName="r" values="4;9;4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="260" r="5" fill="#38bdf8">
      <animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Neural Connecting Lines -->
    <path d="M 150 80 L 300 150 L 120 260 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 1050 90 L 900 180 L 980 280 Z" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Foreground Main Title & Subtitle (High contrast, clearly visible) -->
  <g text-anchor="middle">
    <!-- Badge Pill -->
    <rect x="450" y="45" width="300" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="600" y="66" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#38bdf8" letter-spacing="1">
      🤖 AI &amp; ML MODEL HUB ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="140" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" fill="url(#text-grad)" filter="url(#glow)">
      Pre-Trained Machine Learning Models
    </text>
    <text x="600" y="185" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="32" fill="#ffffff">
      &amp; Solutions Hub
    </text>

    <!-- Subtitle -->
    <text x="600" y="235" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18" fill="#94a3b8">
      Curated Model Hubs • Open-Source LLMs • Serving Frameworks • Inference APIs
    </text>

    <!-- Feature Pills -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">
      <!-- Pill 1 -->
      <rect x="280" y="275" width="180" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="370" y="296" fill="#e2e8f0">⚡ Fast Inference</text>

      <!-- Pill 2 -->
      <rect x="510" y="275" width="180" height="34" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
      <text x="600" y="296" fill="#e2e8f0">🌟 Star Ranked</text>

      <!-- Pill 3 -->
      <rect x="740" y="275" width="180" height="34" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
      <text x="830" y="296" fill="#e2e8f0">🔥 100% Open Source</text>
    </g>
  </g>
</svg>
